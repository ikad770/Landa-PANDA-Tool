<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landa PANDA Tool</title>
  <meta name="description" content="Landa PANDA Tool — Proactive Analyzer Notification DA" />
  <style>
    :root {
      --design-w: 1586;
      --design-h: 992;
      --cyan: #52c8ee;
      --red: #ff475d;
      --glass: rgba(5, 10, 14, 0.58);
      --border: rgba(116, 208, 242, 0.28);
      --text: #eaf6fb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020406;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 42% 28%, rgba(57, 185, 232, 0.09), transparent 34%),
        radial-gradient(circle at 70% 65%, rgba(255, 71, 93, 0.05), transparent 28%),
        linear-gradient(180deg, #071014 0%, #030608 100%);
    }

    .app-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #020406;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 1586 / 992));
      height: min(100vh, calc(100vw * 992 / 1586));
      overflow: hidden;
      border-radius: clamp(0px, 0.28vw, 8px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05),
        0 24px 120px rgba(0,0,0,.86),
        0 0 80px rgba(51,188,235,.10);
      background: #05080a;
      transform: translateZ(0);
    }

    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease, filter 260ms ease;
      transform: scale(1.01);
      filter: brightness(.92);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      filter: brightness(1);
    }

    .screen img.bg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hit {
      position: absolute;
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      outline: none;
    }

    .hit::after {
      content: attr(aria-label);
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: clamp(9px, .72vw, 12px);
      font-weight: 800;
      letter-spacing: .02em;
      color: #081014;
      background: rgba(117, 215, 249, .96);
      box-shadow: 0 10px 26px rgba(82, 200, 238, .26);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .hit:hover::after, .hit:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hit:focus-visible {
      box-shadow: 0 0 0 2px var(--cyan), 0 0 24px rgba(82,200,238,.35);
      border-radius: 12px;
    }

    .bss-hotspot {
      left: 43.4%;
      top: 53.2%;
      width: 7.8%;
      height: 13.2%;
      border-radius: 999px;
    }

    .bss-hotspot::before,
    .overview-drill::before,
    .component-hotspot::before {
      content: "";
      position: absolute;
      inset: 36% 42%;
      border-radius: 50%;
      border: 2px solid rgba(255, 72, 96, .72);
      box-shadow: 0 0 22px rgba(255,72,96,.46), inset 0 0 16px rgba(255,72,96,.25);
      animation: pulse 1.7s ease-out infinite;
      opacity: 0;
    }

    .bss-hotspot:hover::before,
    .overview-drill:hover::before,
    .component-hotspot:hover::before { opacity: 1; }

    .overview-drill {
      left: 76.2%;
      top: 78.0%;
      width: 21.6%;
      height: 5.6%;
      border-radius: 12px;
    }

    .overview-drill::before {
      inset: -8%;
      border-radius: 16px;
    }

    .overview-drill::after {
      top: -34px;
    }

    .overview-logo-hit {
      left: 1.4%;
      top: 1.2%;
      width: 14%;
      height: 5.8%;
      border-radius: 10px;
      cursor: default;
    }

    .back-overview {
      left: 1.1%;
      top: 22.5%;
      width: 14.8%;
      height: 4.4%;
      border-radius: 12px;
    }

    .machine-mini-back {
      left: 0%;
      top: 7.4%;
      width: 16.2%;
      height: 22.4%;
      border-radius: 16px;
    }

    .component-hotspot {
      border-radius: 999px;
    }

    .component-cylinder { left: 20.2%; top: 31.6%; width: 14.8%; height: 19.8%; }
    .component-pressure { left: 41.7%; top: 22.0%; width: 9.2%; height: 8.2%; }
    .component-regulator { left: 58.8%; top: 24.0%; width: 9.2%; height: 9.8%; }
    .component-valve { left: 58.4%; top: 36.0%; width: 9.2%; height: 9.0%; }
    .component-air { left: 58.4%; top: 47.5%; width: 9.2%; height: 9.8%; }
    .component-feedback { left: 40.3%; top: 45.0%; width: 10.4%; height: 9.4%; }
    .component-drive { left: 27.0%; top: 44.7%; width: 8.2%; height: 8.8%; }
    .component-cooling { left: 28.2%; top: 20.8%; width: 9.8%; height: 8.0%; }

    .floating-toast {
      position: absolute;
      right: 2.6%;
      bottom: 2.4%;
      z-index: 20;
      min-width: 250px;
      max-width: 340px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(5, 12, 17, .86);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 34px rgba(82,200,238,.11);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .floating-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .floating-toast strong {
      display: block;
      font-size: 13px;
      color: #fff;
      margin-bottom: 4px;
    }

    .floating-toast span {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(234,246,251,.72);
    }

    .mode-switch {
      position: absolute;
      left: 50%;
      bottom: 1.2%;
      z-index: 30;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
    }

    .mode-switch button {
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      color: rgba(234,246,251,.72);
      background: transparent;
      font-weight: 800;
      font-size: clamp(10px, .72vw, 13px);
      cursor: pointer;
      transition: 160ms ease;
    }

    .mode-switch button.active,
    .mode-switch button:hover {
      color: #061014;
      background: #62d5ff;
      box-shadow: 0 0 24px rgba(98,213,255,.25);
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #020406;
      transition: opacity 360ms ease, visibility 360ms ease;
    }

    .loading.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-card {
      display: grid;
      gap: 14px;
      place-items: center;
      color: white;
      text-align: center;
    }

    .loader-logo {
      width: 74px;
      height: 74px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(135deg, #fff, #d7e6ec 44%, #0a1117 45%);
      display: grid;
      place-items: center;
      color: #081014;
      font-weight: 1000;
      font-size: 34px;
      box-shadow: 0 0 60px rgba(98,213,255,.16);
    }

    .loader-bar {
      width: 220px;
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
    }

    .loader-bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #62d5ff, transparent);
      animation: load 900ms linear infinite;
    }



    /* Native Service Radar overview -------------------------------------------------- */
    .overview-ui {
      display: grid;
      grid-template-rows: 70px 124px 1fr 198px 42px;
      gap: 12px;
      padding: 0 18px;
      background:
        radial-gradient(circle at 42% 38%, rgba(94, 166, 205, .14), transparent 32%),
        radial-gradient(circle at 76% 54%, rgba(255, 71, 93, .08), transparent 24%),
        linear-gradient(180deg, #070c10 0%, #030608 100%);
    }

    .topbar {
      display: grid;
      grid-template-columns: 455px 1fr 392px;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .drag-grid { width: 24px; display: grid; grid-template-columns: repeat(3, 4px); gap: 5px; opacity: .62; }
    .drag-grid span { width: 4px; height: 4px; border-radius: 50%; background: rgba(234,246,251,.65); }
    .landa-logo { font-size: 36px; letter-spacing: -.08em; font-weight: 300; color: #fff; line-height: 1; }
    .landa-logo .accent { color: #46cfff; }
    .product-title { border-left: 1px solid rgba(255,255,255,.24); padding-left: 18px; }
    .product-title strong { display: block; font-size: 22px; line-height: 1; }
    .product-title span { display: block; margin-top: 7px; font-size: 12px; color: rgba(234,246,251,.72); }

    .primary-nav { justify-self: center; display: flex; align-items: center; gap: 36px; height: 100%; }
    .primary-nav a { position: relative; color: rgba(234,246,251,.80); text-decoration: none; font-size: 14px; font-weight: 700; }
    .primary-nav a.active { color: #fff; padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
    .primary-nav a.active::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 7px; height: 2px; border-radius: 9px; background: #32c7f3; box-shadow: 0 0 16px rgba(50,199,243,.65); }

    .utility-strip { justify-self: end; display: flex; align-items: center; gap: 18px; }
    .time-range { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; background: rgba(255,255,255,.045); color: rgba(255,255,255,.86); font-size: 13px; font-weight: 700; }
    .icon-btn, .avatar { border: 0; color: #dceaf0; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
    .icon-btn { position: relative; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
    .icon-btn .badge { position: absolute; right: -2px; top: -3px; width: 13px; height: 13px; border-radius: 50%; background: #36cdf7; color: #06202a; font-size: 8px; font-weight: 1000; display: grid; place-items: center; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; font-weight: 900; }

    .kpi-grid { display: grid; grid-template-columns: 1.05fr 1fr 1.35fr 1fr 1.35fr; gap: 12px; }
    .glass-card { border: 1px solid rgba(116,208,242,.16); border-radius: 10px; background: linear-gradient(135deg, rgba(15,22,29,.80), rgba(3,8,12,.74)); box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 24px 80px rgba(0,0,0,.28); }
    .kpi-card { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 16px; padding: 18px 24px; }
    .kpi-icon { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: #38cfff; border: 1px solid rgba(56,207,255,.42); background: radial-gradient(circle, rgba(56,207,255,.18), rgba(56,207,255,.04)); box-shadow: 0 0 28px rgba(56,207,255,.12); font-size: 22px; }
    .kpi-icon.danger { color: #ff475d; border-color: rgba(255,71,93,.36); background: radial-gradient(circle, rgba(255,71,93,.20), rgba(255,71,93,.04)); }
    .kpi-label { color: rgba(234,246,251,.68); font-size: 12px; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; }
    .kpi-value { margin-top: 8px; font-size: 32px; line-height: 1; font-weight: 900; color: #fff; }
    .kpi-value small { color: rgba(234,246,251,.62); font-size: 25px; font-weight: 700; }
    .kpi-sub { margin-top: 10px; color: rgba(234,246,251,.62); font-size: 12px; }
    .sparkline { width: 120px; height: 34px; float: right; margin-top: -22px; }

    .overview-main { display: grid; grid-template-columns: 1fr 360px; gap: 12px; min-height: 0; }
    .machine-panel { position: relative; overflow: hidden; padding: 18px 16px; }
    .machine-panel::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 46% 14%, rgba(179,215,236,.22), transparent 32%), linear-gradient(180deg, rgba(12,20,27,.54), rgba(3,8,12,.72)); pointer-events: none; }
    .machine-head, .view-toggle, .machine-stage-tools, .machine-photo, .machine-hotspot { position: relative; z-index: 1; }
    .eyebrow { font-size: 16px; font-weight: 900; color: #fff; }
    .machine-title { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 24px; font-weight: 900; color: #fff; }
    .online { display: inline-flex; align-items: center; gap: 6px; color: #7ce887; font-size: 11px; font-weight: 1000; text-transform: uppercase; }
    .online::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #73e781; box-shadow: 0 0 10px rgba(115,231,129,.7); }
    .view-toggle { margin-top: 24px; display: flex; align-items: center; gap: 10px; color: rgba(234,246,251,.72); font-size: 13px; }
    .toggle-pill { display: flex; padding: 4px; border-radius: 8px; background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.08); }
    .toggle-pill button { width: 34px; height: 28px; border: 0; border-radius: 6px; color: rgba(234,246,251,.70); background: transparent; font-weight: 900; }
    .toggle-pill button.active { color: #55d8ff; background: rgba(85,216,255,.16); }

    .machine-photo { position: absolute; left: 38px; right: 22px; bottom: 92px; height: 336px; overflow: hidden; }
    .machine-photo img { position: absolute; width: 1189px; height: auto; left: -12px; top: -296px; filter: saturate(1.03) contrast(1.04); user-select: none; pointer-events: none; }
    .machine-stage-tools { position: absolute; left: 16px; bottom: 38px; display: flex; gap: 1px; padding: 8px; border-radius: 12px; background: rgba(2,6,9,.62); border: 1px solid rgba(255,255,255,.08); }
    .machine-stage-tools button { width: 42px; height: 32px; border: 0; border-left: 1px solid rgba(255,255,255,.08); background: transparent; color: #dff7ff; font-size: 18px; }
    .machine-stage-tools button:first-child { border-left: 0; }

    .machine-hotspot { position: absolute; border: 0; background: transparent; color: #fff; cursor: pointer; }
    .hot-dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(78,218,255,.60); background: rgba(5,17,23,.82); box-shadow: 0 0 0 7px rgba(78,218,255,.10), 0 0 22px rgba(78,218,255,.36); }
    .hot-dot::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: #28c7ee; box-shadow: inset 0 0 8px rgba(255,255,255,.38); }
    .machine-hotspot.danger .hot-dot { border-color: rgba(255,71,93,.85); box-shadow: 0 0 0 7px rgba(255,71,93,.13), 0 0 32px rgba(255,71,93,.65); }
    .machine-hotspot.danger .hot-dot::after { background: #ff475d; }
    .machine-hotspot::before { content: ""; position: absolute; left: 17px; top: 34px; width: 1px; height: var(--stem, 45px); background: linear-gradient(rgba(234,246,251,.55), rgba(234,246,251,.10)); }
    .machine-hotspot.below::before { top: auto; bottom: 34px; }
    .hot-label { position: absolute; left: 34px; top: 8px; min-width: 92px; padding: 7px 9px; border-radius: 6px; text-align: left; font-size: 11px; line-height: 1.15; background: rgba(5,9,13,.70); border: 1px solid rgba(255,255,255,.10); }
    .hot-label strong { display: block; font-size: 14px; color: #fff; }
    .machine-hotspot.below .hot-label { left: -17px; top: 42px; }

    .issue-panel { overflow: hidden; display: flex; flex-direction: column; }
    .issue-body { padding: 15px 16px; display: grid; gap: 13px; }
    .issue-top { display: flex; justify-content: space-between; align-items: center; color: #ff475d; font-size: 12px; font-weight: 1000; }
    .pill-danger { color: #ff6b79; background: rgba(255,71,93,.18); border-radius: 999px; padding: 4px 12px; }
    .issue-title { font-size: 22px; font-weight: 950; color: #fff; }
    .issue-title span { font-size: 16px; font-weight: 500; color: rgba(234,246,251,.78); margin-left: 6px; }
    .issue-subtitle { font-size: 13px; color: #fff; }
    .summary-block { border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; }
    .section-label { color: rgba(234,246,251,.52); font-size: 11px; font-weight: 1000; text-transform: uppercase; margin-bottom: 7px; }
    .summary-block p { margin: 0; color: rgba(234,246,251,.86); font-size: 13px; line-height: 1.42; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid rgba(116,208,242,.12); border-radius: 10px; overflow: hidden; }
    .metric { padding: 12px; border-right: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.02); }
    .metric:nth-child(2n) { border-right: 0; }
    .metric:nth-last-child(-n+2) { border-bottom: 0; }
    .metric strong { display: block; color: #fff; font-size: 18px; margin-top: 3px; }
    .metric span { color: rgba(234,246,251,.58); font-size: 11px; }
    .chart-wrap svg { width: 100%; height: 118px; display: block; }
    .drill-cta { margin-top: auto; width: 100%; height: 34px; border: 0; border-radius: 6px; color: white; background: linear-gradient(90deg, #38bde7, #38aee6); font-size: 14px; font-weight: 1000; cursor: pointer; }

    .bottom-grid { display: grid; grid-template-columns: 1.45fr 1.05fr .93fr; gap: 12px; }
    .data-card { padding: 14px; overflow: hidden; }
    .timeline { display: flex; align-items: stretch; margin-top: 36px; height: 50px; border-radius: 5px; overflow: visible; }
    .state-segment { position: relative; display: grid; place-items: center; color: rgba(255,255,255,.88); font-size: 12px; min-width: 54px; border-right: 1px solid rgba(0,0,0,.24); }
    .state-segment.active::before { content: attr(data-time); position: absolute; top: -30px; right: -24px; padding: 5px 8px; border-radius: 5px; background: rgba(179,45,48,.92); color: #fff; font-weight: 1000; }
    .state-segment.active::after { content: ""; position: absolute; top: -3px; right: -1px; bottom: -20px; width: 2px; background: #ff475d; box-shadow: 0 0 13px rgba(255,71,93,.7); }
    .legend { display: flex; justify-content: center; gap: 20px; margin-top: 32px; color: rgba(234,246,251,.70); font-size: 11px; }
    .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 1px; }
    .evidence-list { margin-top: 6px; border-radius: 9px; overflow: hidden; border: 1px solid rgba(255,255,255,.04); }
    .evidence-row { display: grid; grid-template-columns: 60px 104px 1fr; gap: 10px; padding: 7px 8px; font-size: 12px; background: rgba(255,255,255,.035); border-bottom: 1px solid rgba(255,255,255,.04); }
    .evidence-row:last-child { border-bottom: 0; }
    .source { font-weight: 800; }
    .actions-list { margin: 8px 0 11px; padding: 0; list-style: none; display: grid; gap: 8px; }
    .actions-list li { display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 8px; color: rgba(234,246,251,.72); font-size: 12px; }
    .actions-list b { display: grid; place-items: center; height: 22px; border-radius: 5px; color: #cdefff; background: rgba(116,208,242,.10); border: 1px solid rgba(116,208,242,.16); }
    .knowledge-btn { width: 100%; height: 30px; border: 0; border-radius: 6px; color: rgba(255,255,255,.86); background: rgba(255,255,255,.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); font-weight: 900; }

    .statusbar { display: flex; align-items: center; gap: 22px; padding: 0 10px; border-top: 1px solid rgba(255,255,255,.07); color: rgba(234,246,251,.64); font-size: 12px; }
    .statusbar .landa-logo { font-size: 22px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; background: #69d778; box-shadow: 0 0 10px rgba(105,215,120,.68); }
    .status-spacer { flex: 1; }

    @keyframes pulse {
      0% { transform: scale(.3); opacity: .85; }
      85% { transform: scale(2.7); opacity: 0; }
      100% { transform: scale(3); opacity: 0; }
    }

    @keyframes load {
      from { transform: translateX(-100%); }
      to { transform: translateX(260%); }
    }

    @media (max-width: 900px) {
      .mode-switch { display: none; }
      .floating-toast { left: 3%; right: 3%; bottom: 3%; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loader-card">
      <div class="loader-logo">P</div>
      <div>
        <div style="font-weight: 1000; letter-spacing:.03em; font-size: 20px;">Landa PANDA Tool</div>
        <div style="font-size:12px;color:rgba(234,246,251,.58);margin-top:4px;">Loading Service Radar</div>
      </div>
      <div class="loader-bar"></div>
    </div>
  </div>

  <main class="app-shell" aria-label="Landa PANDA Tool">
    <section class="stage">
      <div class="screen active overview-ui" id="overview" aria-label="Service Radar Overview">
        <header class="topbar" id="overviewHeader"></header>
        <section class="kpi-grid" id="kpiGrid" aria-label="Machine service KPIs"></section>
        <section class="overview-main">
          <article class="glass-card machine-panel" aria-label="Machine Overview">
            <div class="machine-head">
              <div class="eyebrow">Machine Overview</div>
              <div class="machine-title"><span id="machineName"></span><span class="online">Online</span></div>
            </div>
            <div class="view-toggle">View:<span class="toggle-pill"><button class="active" type="button">▦</button><button type="button">☰</button></span></div>
            <div class="machine-photo" aria-hidden="true"><img src="assets/service-radar.png" alt="" /></div>
            <div id="hotspotLayer"></div>
            <div class="machine-stage-tools" aria-label="Machine view tools"><button type="button">▧</button><button type="button">⟳</button><button type="button">⌕</button><button type="button">⛶</button></div>
          </article>
          <aside class="glass-card issue-panel" id="activeIssuePanel" aria-label="Right active issue panel"></aside>
        </section>
        <section class="bottom-grid">
          <article class="glass-card data-card" id="timelineCard" aria-label="State timeline"></article>
          <article class="glass-card data-card" id="evidenceCard" aria-label="Evidence log"></article>
          <article class="glass-card data-card" id="actionsCard" aria-label="Service actions"></article>
        </section>
        <footer class="statusbar" id="statusbar"></footer>
      </div>

      <div class="screen" id="drilldown" aria-label="BSS Blanket System Drill-Down">
        <img class="bg" src="assets/drilldown.png" alt="BSS Blanket System drill-down" />
        <button class="hit back-overview" aria-label="Back to Machine Overview" data-action="overview"></button>
        <button class="hit machine-mini-back" aria-label="View Machine Overview" data-action="overview"></button>
        <button class="hit component-hotspot component-cylinder" aria-label="Blanket Cylinder — Critical" data-component="Blanket Cylinder"></button>
        <button class="hit component-hotspot component-pressure" aria-label="Pressure Sensor — Warning" data-component="Pressure Sensor"></button>
        <button class="hit component-hotspot component-regulator" aria-label="Regulator — Normal" data-component="Regulator"></button>
        <button class="hit component-hotspot component-valve" aria-label="Valve Block — Normal" data-component="Valve Block"></button>
        <button class="hit component-hotspot component-air" aria-label="Air Supply — Normal" data-component="Air Supply"></button>
        <button class="hit component-hotspot component-feedback" aria-label="Feedback Sensor — Normal" data-component="Feedback Sensor"></button>
        <button class="hit component-hotspot component-drive" aria-label="Drive Motor — Normal" data-component="Drive Motor"></button>
        <button class="hit component-hotspot component-cooling" aria-label="Cooling Loop — Normal" data-component="Cooling Loop"></button>
      </div>

      <div class="floating-toast" id="toast">
        <strong id="toastTitle">Component selected</strong>
        <span id="toastText">Evidence, signals and service action are now focused on this component.</span>
      </div>

      <nav class="mode-switch" aria-label="Prototype screen switcher">
        <button class="active" id="overviewBtn" data-action="overview">Service Radar</button>
        <button id="drillBtn" data-action="drilldown">BSS Drill-Down</button>
      </nav>
    </section>
  </main>

  <script>
    const serviceRadarData = {
      header: {
        product: 'PANDA Tool',
        subtitle: 'Proactive Analyzer Notification DA',
        nav: ['Service Radar', 'Alerts', 'Analysis', 'Machines', 'Reports', 'Knowledge'],
        timeRange: 'May 27, 2025  11:10 — 14:10',
        user: 'JD',
        notifications: 3
      },
      machine: {
        name: 'Landa S11-1P',
        site: 'Customer A',
        connection: 'Data Connection',
        engine: 'PANDA Engine',
        lastData: '14:10:15'
      },
      kpis: [
        { label: 'Machines at risk', value: '3', suffix: '/ 18', helper: 'With active anomalies', icon: '♟', tone: 'normal' },
        { label: 'P1 alerts', value: '2', suffix: '', helper: 'Requiring immediate attention', icon: '⚠', tone: 'danger' },
        { label: 'Detection confidence', value: '92', suffix: '%', helper: 'Average across all machines', icon: '◎', tone: 'normal', sparkline: [8, 9, 8, 10, 13, 20, 10, 24, 15, 12] },
        { label: 'Open preventive actions', value: '7', suffix: '', helper: 'Across 4 machines', icon: '☑', tone: 'normal' },
        { label: 'Mean time to detect', value: '18', suffix: 'min', helper: 'vs last 30 days  ↓ 22%', icon: '◔', tone: 'normal' }
      ],
      hotspots: [
        { id: 'ird', code: 'IRD', label: 'Imaging', x: 23.6, y: 28.0, stem: 45, severity: 'normal' },
        { id: 'fec', code: 'FEC', label: 'Feeder', x: 46.0, y: 24.0, stem: 44, severity: 'normal' },
        { id: 'ips', code: 'IPS', label: 'Ink Process', x: 60.8, y: 27.0, stem: 42, severity: 'normal' },
        { id: 'ecc', code: 'ECC', label: 'Engine Control', x: 76.2, y: 22.0, stem: 55, severity: 'normal' },
        { id: 'llci', code: 'LLCI', label: 'Laydown', x: 94.2, y: 28.0, stem: 43, severity: 'normal' },
        { id: 'bss', code: 'BSS', label: 'Blanket System', x: 60.8, y: 74.2, stem: 70, severity: 'danger', action: 'drilldown', below: true },
        { id: 'pump', code: '', label: '', x: 90.8, y: 60.5, stem: 0, severity: 'normal' }
      ],
      activeIssue: {
        subsystem: 'BSS',
        title: 'Blanket System',
        condition: 'Blanket Pressure Deviation',
        priority: 'P1',
        summary: 'Blanket Cylinder Pressure is above expected band repeatedly during Printing state.',
        context: 'Printing',
        duration: '22m 14s',
        since: '13:47',
        confidence: '96%',
        severity: 'P1 High',
        signal: 'Blanket Cylinder Pressure (psi)',
        actualRange: { min: 420, max: 568 }
      },
      timeline: [
        { state: 'Standby', start: '11:10', color: '#2f3a45', width: 10 },
        { state: 'Ready', start: '11:50', color: '#66ad67', width: 8 },
        { state: 'Prepare2Print', start: '12:05', color: '#d6ba2e', width: 14 },
        { state: 'Printing', start: '12:30', color: '#cf4442', width: 14 },
        { state: 'PrintEnd', start: '13:10', color: '#634582', width: 11 },
        { state: 'Ready', start: '13:20', color: '#66ad67', width: 11 },
        { state: 'Prepare2Print', start: '13:40', color: '#d6ba2e', width: 12 },
        { state: 'Printing', start: '13:47', color: '#cf4442', width: 14, active: true },
        { state: 'PrintEnd', start: '14:00', color: '#634582', width: 10 },
        { state: 'Standby', start: '14:10', color: '#2f3a45', width: 10 }
      ],
      evidenceLog: [
        { time: '13:47:02', source: 'StateMachine', color: '#ff475d', message: 'State changed to: Printing' },
        { time: '13:47:05', source: 'FECNotifications', color: '#38bde7', message: 'BSS: Blanket pressure high deviation detected' },
        { time: '13:47:06', source: 'RulesEngine', color: '#69d778', message: 'Rule R-BSS-001 triggered (severity: P1)' },
        { time: '13:47:06', source: 'Correlation', color: '#f2ca35', message: 'Correlated with state: Printing (confidence: 0.96)' },
        { time: '13:47:07', source: 'FECNotifications', color: '#38bde7', message: 'Pressure spike count in last 5 min: 18' }
      ],
      serviceActions: [
        'Check blanket cylinder pressure sensor calibration.',
        'Inspect air supply and regulator to blanket system.',
        'Verify blanket cylinder for mechanical friction / debris.',
        'Review recent maintenance and replacement history.'
      ]
    };

    function sparklinePath(values, width = 120, height = 34) {
      const max = Math.max(...values);
      const min = Math.min(...values);
      return values.map((value, index) => {
        const x = (index / (values.length - 1)) * width;
        const y = height - ((value - min) / (max - min || 1)) * (height - 6) - 3;
        return `${index ? 'L' : 'M'} ${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(' ');
    }

    function renderOverview(data) {
      document.getElementById('overviewHeader').innerHTML = `
        <div class="brand"><div class="drag-grid">${'<span></span>'.repeat(9)}</div><div class="landa-logo">Lan<span class="accent">d</span>a</div><div class="product-title"><strong>${data.header.product}</strong><span>${data.header.subtitle}</span></div></div>
        <nav class="primary-nav" aria-label="Primary navigation">${data.header.nav.map((item, i) => `<a class="${i === 0 ? 'active' : ''}" href="#overview">${item}</a>`).join('')}</nav>
        <div class="utility-strip"><div class="time-range">▣ <span>${data.header.timeRange}</span>⌄</div><button class="icon-btn" type="button" aria-label="Notifications">♧<span class="badge">${data.header.notifications}</span></button><button class="avatar" type="button" aria-label="Service user">${data.header.user}</button><span>⌄</span></div>`;

      document.getElementById('kpiGrid').innerHTML = data.kpis.map((kpi) => `
        <article class="glass-card kpi-card"><div class="kpi-icon ${kpi.tone === 'danger' ? 'danger' : ''}">${kpi.icon}</div><div><div class="kpi-label">${kpi.label}</div><div class="kpi-value">${kpi.value}<small> ${kpi.suffix}</small></div>${kpi.sparkline ? `<svg class="sparkline" viewBox="0 0 120 34"><path d="${sparklinePath(kpi.sparkline)}" fill="none" stroke="#38cfff" stroke-width="2"/><path d="${sparklinePath(kpi.sparkline)} L 120 34 L 0 34 Z" fill="rgba(56,207,255,.12)"/></svg>` : ''}<div class="kpi-sub">${kpi.helper}</div></div></article>`).join('');

      document.getElementById('machineName').textContent = data.machine.name;
      document.getElementById('hotspotLayer').innerHTML = data.hotspots.map((hotspot) => `
        <button class="machine-hotspot ${hotspot.severity === 'danger' ? 'danger' : ''} ${hotspot.below ? 'below' : ''}" style="left:${hotspot.x}%;top:${hotspot.y}%;--stem:${hotspot.stem}px" aria-label="${hotspot.code} ${hotspot.label}" ${hotspot.action ? `data-action="${hotspot.action}"` : ''} type="button"><span class="hot-dot"></span>${hotspot.code ? `<span class="hot-label"><strong>${hotspot.code}</strong>${hotspot.label}</span>` : ''}</button>`).join('');

      document.getElementById('activeIssuePanel').innerHTML = `
        <div class="issue-body"><div class="issue-top"><span>⌁ Active Issue</span><span class="pill-danger">${data.activeIssue.priority}</span></div><div><div class="issue-title">${data.activeIssue.subsystem} <span>${data.activeIssue.title}</span></div><div class="issue-subtitle">${data.activeIssue.condition}</div></div><div class="summary-block"><div class="section-label">Summary</div><p>${data.activeIssue.summary}</p></div><div class="metric-grid"><div class="metric"><span>State Context</span><strong>● ${data.activeIssue.context}</strong></div><div class="metric"><span>Duration</span><strong>◷ ${data.activeIssue.duration}</strong><span>Since ${data.activeIssue.since}</span></div><div class="metric"><span>Confidence</span><strong>${data.activeIssue.confidence}</strong><span>High</span></div><div class="metric"><span>Severity</span><strong>▲ ${data.activeIssue.severity}</strong></div></div><div class="chart-wrap"><div class="section-label">Actual vs Expected</div><svg viewBox="0 0 330 118" role="img" aria-label="Actual pressure exceeds expected band"><defs><linearGradient id="band" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#39cfff" stop-opacity=".24"/><stop offset="1" stop-color="#39cfff" stop-opacity=".05"/></linearGradient></defs><text x="0" y="12" fill="rgba(234,246,251,.66)" font-size="11">${data.activeIssue.signal}</text><text x="235" y="12" fill="rgba(234,246,251,.60)" font-size="10">Min: ${data.activeIssue.actualRange.min}</text><text x="285" y="12" fill="rgba(234,246,251,.60)" font-size="10">Max: ${data.activeIssue.actualRange.max}</text><g transform="translate(0 22)"><path d="M0 56 L330 56" stroke="rgba(255,255,255,.18)"/><path d="M0 22 H330 V76 H0 Z" fill="url(#band)"/><path d="M0 58 C30 26 60 40 88 54 S132 62 156 35 S194 28 220 22 S266 42 330 28" fill="none" stroke="#ff475d" stroke-width="2"/><path d="M0 44 C50 42 88 43 124 43 S210 42 330 42" fill="none" stroke="#39cfff" stroke-width="2"/><line x1="150" y1="0" x2="150" y2="88" stroke="#ff475d"/><circle cx="150" cy="0" r="3" fill="#ff475d"/><g stroke="rgba(255,255,255,.08)">${[0,55,110,165,220,275,330].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="88"/>`).join('')}</g><text x="0" y="104" fill="rgba(234,246,251,.56)" font-size="10">13:30</text><text x="144" y="104" fill="rgba(234,246,251,.56)" font-size="10">13:50</text><text x="292" y="104" fill="rgba(234,246,251,.56)" font-size="10">14:10</text></g></svg></div><button class="drill-cta" data-action="drilldown" type="button">Open Drill-Down →</button></div>`;

      document.getElementById('timelineCard').innerHTML = `<div class="section-label">State Machine Timeline ⓘ</div><div class="timeline">${data.timeline.map(segment => `<div class="state-segment ${segment.active ? 'active' : ''}" data-time="${segment.start}" style="background:${segment.color};flex:${segment.width}">${segment.state}</div>`).join('')}</div><div class="legend">${['Standby','#2f3a45','Ready','#66ad67','Prepare2Print','#d6ba2e','Printing','#cf4442','PrintEnd','#634582'].reduce((html, item, index, arr) => index % 2 ? html : html + `<span><i style="background:${arr[index+1]}"></i>${item}</span>`, '')}</div>`;
      document.getElementById('evidenceCard').innerHTML = `<div class="section-label">Evidence Log (Latest)</div><div class="evidence-list">${data.evidenceLog.map(row => `<div class="evidence-row"><span>${row.time}</span><span class="source" style="color:${row.color}">${row.source}</span><span>${row.message}</span></div>`).join('')}</div>`;
      document.getElementById('actionsCard').innerHTML = `<div class="section-label">Recommended Service Action</div><ol class="actions-list">${data.serviceActions.map((action, index) => `<li><b>${index + 1}</b><span>${action}</span></li>`).join('')}</ol><button class="knowledge-btn" type="button">View Knowledge Article ↗</button>`;
      document.getElementById('statusbar').innerHTML = `<div class="landa-logo">Lan<span class="accent">d</span>a</div><span><i class="status-dot"></i>${data.machine.connection}</span><span><i class="status-dot"></i>${data.machine.engine}</span><span>Last Data: ${data.machine.lastData}</span><span class="status-spacer"></span><span>Machine: ${data.machine.name}</span><span>|</span><span>Site: ${data.machine.site}</span><span>|</span><span>Service User: John D.</span><span>⋮</span>`;
    }

    const overview = document.getElementById('overview');
    const drilldown = document.getElementById('drilldown');
    const overviewBtn = document.getElementById('overviewBtn');
    const drillBtn = document.getElementById('drillBtn');
    const toast = document.getElementById('toast');
    const toastTitle = document.getElementById('toastTitle');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;

    function setScreen(name) {
      const isDrill = name === 'drilldown';
      overview.classList.toggle('active', !isDrill);
      drilldown.classList.toggle('active', isDrill);
      overviewBtn.classList.toggle('active', !isDrill);
      drillBtn.classList.toggle('active', isDrill);
      window.location.hash = isDrill ? 'drilldown' : 'overview';
    }

    function showToast(title, text) {
      toastTitle.textContent = title;
      toastText.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
    }

    document.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (actionEl) {
        const action = actionEl.getAttribute('data-action');
        if (action === 'drilldown') {
          setScreen('drilldown');
          showToast('BSS Blanket System opened', 'Subsystem cutaway, root-cause ranking, evidence logs and recommended actions are displayed.');
        }
        if (action === 'overview') {
          setScreen('overview');
          showToast('Machine Overview', 'Returned to the full Landa S11-1P Service Radar.');
        }
        return;
      }

      const componentEl = event.target.closest('[data-component]');
      if (componentEl) {
        const component = componentEl.getAttribute('data-component');
        const critical = component === 'Blanket Cylinder';
        const warning = component === 'Pressure Sensor';
        showToast(
          component + ' selected',
          critical
            ? 'Critical component. PANDA ranks it as the most likely root cause for the pressure deviation.'
            : warning
              ? 'Warning component. Check calibration and compare against the Blanket Cylinder evidence.'
              : 'Normal component. Included for context and correlation checks.'
        );
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setScreen('overview');
      if (event.key === '1') setScreen('overview');
      if (event.key === '2') setScreen('drilldown');
    });

    window.addEventListener('load', () => {
      renderOverview(serviceRadarData);
      const initial = window.location.hash.replace('#', '') === 'drilldown' ? 'drilldown' : 'overview';
      setScreen(initial);
      setTimeout(() => document.getElementById('loading').classList.add('hide'), 420);
    });
  </script>
</body>
</html>
