<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landa PANDA Tool</title>
  <meta name="description" content="Landa PANDA Tool — Proactive Analyzer Notification DA" />
  <style>
    :root {
      --design-w: 1586;
      --design-h: 992;
      --cyan: #52c8ee;
      --red: #ff475d;
      --glass: rgba(5, 10, 14, 0.58);
      --border: rgba(116, 208, 242, 0.28);
      --text: #eaf6fb;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020406;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 42% 28%, rgba(57, 185, 232, 0.09), transparent 34%),
        radial-gradient(circle at 70% 65%, rgba(255, 71, 93, 0.05), transparent 28%),
        linear-gradient(180deg, #071014 0%, #030608 100%);
    }

    .app-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #020406;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 1586 / 992));
      height: min(100vh, calc(100vw * 992 / 1586));
      overflow: hidden;
      border-radius: clamp(0px, 0.28vw, 8px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05),
        0 24px 120px rgba(0,0,0,.86),
        0 0 80px rgba(51,188,235,.10);
      background: #05080a;
      transform: translateZ(0);
    }

    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease, filter 260ms ease;
      transform: scale(1.01);
      filter: brightness(.92);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      filter: brightness(1);
    }

    .screen img.bg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hit {
      position: absolute;
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      outline: none;
    }

    .hit::after {
      content: attr(aria-label);
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: clamp(9px, .72vw, 12px);
      font-weight: 800;
      letter-spacing: .02em;
      color: #081014;
      background: rgba(117, 215, 249, .96);
      box-shadow: 0 10px 26px rgba(82, 200, 238, .26);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .hit:hover::after, .hit:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hit:focus-visible {
      box-shadow: 0 0 0 2px var(--cyan), 0 0 24px rgba(82,200,238,.35);
      border-radius: 12px;
    }

    .bss-hotspot {
      left: 43.4%;
      top: 53.2%;
      width: 7.8%;
      height: 13.2%;
      border-radius: 999px;
    }

    .bss-hotspot::before,
    .overview-drill::before,
    .component-hotspot::before {
      content: "";
      position: absolute;
      inset: 36% 42%;
      border-radius: 50%;
      border: 2px solid rgba(255, 72, 96, .72);
      box-shadow: 0 0 22px rgba(255,72,96,.46), inset 0 0 16px rgba(255,72,96,.25);
      animation: pulse 1.7s ease-out infinite;
      opacity: 0;
    }

    .bss-hotspot:hover::before,
    .overview-drill:hover::before,
    .component-hotspot:hover::before { opacity: 1; }

    .overview-drill {
      left: 76.2%;
      top: 78.0%;
      width: 21.6%;
      height: 5.6%;
      border-radius: 12px;
    }

    .overview-drill::before {
      inset: -8%;
      border-radius: 16px;
    }

    .overview-drill::after {
      top: -34px;
    }

    .overview-logo-hit {
      left: 1.4%;
      top: 1.2%;
      width: 14%;
      height: 5.8%;
      border-radius: 10px;
      cursor: default;
    }

    .back-overview {
      left: 1.1%;
      top: 22.5%;
      width: 14.8%;
      height: 4.4%;
      border-radius: 12px;
    }

    .machine-mini-back {
      left: 0%;
      top: 7.4%;
      width: 16.2%;
      height: 22.4%;
      border-radius: 16px;
    }

    .component-hotspot {
      border-radius: 999px;
    }

    .component-cylinder { left: 20.2%; top: 31.6%; width: 14.8%; height: 19.8%; }
    .component-pressure { left: 41.7%; top: 22.0%; width: 9.2%; height: 8.2%; }
    .component-regulator { left: 58.8%; top: 24.0%; width: 9.2%; height: 9.8%; }
    .component-valve { left: 58.4%; top: 36.0%; width: 9.2%; height: 9.0%; }
    .component-air { left: 58.4%; top: 47.5%; width: 9.2%; height: 9.8%; }
    .component-feedback { left: 40.3%; top: 45.0%; width: 10.4%; height: 9.4%; }
    .component-drive { left: 27.0%; top: 44.7%; width: 8.2%; height: 8.8%; }
    .component-cooling { left: 28.2%; top: 20.8%; width: 9.8%; height: 8.0%; }

    .floating-toast {
      position: absolute;
      right: 2.6%;
      bottom: 2.4%;
      z-index: 20;
      min-width: 250px;
      max-width: 340px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(5, 12, 17, .86);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 34px rgba(82,200,238,.11);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .floating-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .floating-toast strong {
      display: block;
      font-size: 13px;
      color: #fff;
      margin-bottom: 4px;
    }

    .floating-toast span {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(234,246,251,.72);
    }

    .mode-switch {
      position: absolute;
      left: 50%;
      bottom: 1.2%;
      z-index: 30;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
    }

    .mode-switch button {
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      color: rgba(234,246,251,.72);
      background: transparent;
      font-weight: 800;
      font-size: clamp(10px, .72vw, 13px);
      cursor: pointer;
      transition: 160ms ease;
    }

    .mode-switch button.active,
    .mode-switch button:hover {
      color: #061014;
      background: #62d5ff;
      box-shadow: 0 0 24px rgba(98,213,255,.25);
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #020406;
      transition: opacity 360ms ease, visibility 360ms ease;
    }

    .loading.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-card {
      display: grid;
      gap: 14px;
      place-items: center;
      color: white;
      text-align: center;
    }

    .loader-logo {
      width: 74px;
      height: 74px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(135deg, #fff, #d7e6ec 44%, #0a1117 45%);
      display: grid;
      place-items: center;
      color: #081014;
      font-weight: 1000;
      font-size: 34px;
      box-shadow: 0 0 60px rgba(98,213,255,.16);
    }

    .loader-bar {
      width: 220px;
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
    }

    .loader-bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #62d5ff, transparent);
      animation: load 900ms linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(.3); opacity: .85; }
      85% { transform: scale(2.7); opacity: 0; }
      100% { transform: scale(3); opacity: 0; }
    }

    @keyframes load {
      from { transform: translateX(-100%); }
      to { transform: translateX(260%); }
    }

    @media (max-width: 900px) {
      .mode-switch { display: none; }
      .floating-toast { left: 3%; right: 3%; bottom: 3%; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loader-card">
      <div class="loader-logo">P</div>
      <div>
        <div style="font-weight: 1000; letter-spacing:.03em; font-size: 20px;">Landa PANDA Tool</div>
        <div style="font-size:12px;color:rgba(234,246,251,.58);margin-top:4px;">Loading Service Radar</div>
      </div>
      <div class="loader-bar"></div>
    </div>
  </div>

  <main class="app-shell" aria-label="Landa PANDA Tool">
    <section class="stage">
      <div class="screen active" id="overview" aria-label="Service Radar Overview">
        <img class="bg" src="assets/service-radar.png" alt="Landa PANDA Tool Service Radar overview" />
        <button class="hit overview-logo-hit" aria-label="Landa PANDA Tool"></button>
        <button class="hit bss-hotspot" aria-label="Open BSS Blanket System drill-down" data-action="drilldown"></button>
        <button class="hit overview-drill" aria-label="Open Drill-Down" data-action="drilldown"></button>
      </div>

      <div class="screen" id="drilldown" aria-label="BSS Blanket System Drill-Down">
        <img class="bg" src="assets/drilldown.png" alt="BSS Blanket System drill-down" />
        <button class="hit back-overview" aria-label="Back to Machine Overview" data-action="overview"></button>
        <button class="hit machine-mini-back" aria-label="View Machine Overview" data-action="overview"></button>
        <button class="hit component-hotspot component-cylinder" aria-label="Blanket Cylinder — Critical" data-component="Blanket Cylinder"></button>
        <button class="hit component-hotspot component-pressure" aria-label="Pressure Sensor — Warning" data-component="Pressure Sensor"></button>
        <button class="hit component-hotspot component-regulator" aria-label="Regulator — Normal" data-component="Regulator"></button>
        <button class="hit component-hotspot component-valve" aria-label="Valve Block — Normal" data-component="Valve Block"></button>
        <button class="hit component-hotspot component-air" aria-label="Air Supply — Normal" data-component="Air Supply"></button>
        <button class="hit component-hotspot component-feedback" aria-label="Feedback Sensor — Normal" data-component="Feedback Sensor"></button>
        <button class="hit component-hotspot component-drive" aria-label="Drive Motor — Normal" data-component="Drive Motor"></button>
        <button class="hit component-hotspot component-cooling" aria-label="Cooling Loop — Normal" data-component="Cooling Loop"></button>
      </div>

      <div class="floating-toast" id="toast">
        <strong id="toastTitle">Component selected</strong>
        <span id="toastText">Evidence, signals and service action are now focused on this component.</span>
      </div>

      <nav class="mode-switch" aria-label="Prototype screen switcher">
        <button class="active" id="overviewBtn" data-action="overview">Service Radar</button>
        <button id="drillBtn" data-action="drilldown">BSS Drill-Down</button>
      </nav>
    </section>
  </main>

  <script>
    const overview = document.getElementById('overview');
    const drilldown = document.getElementById('drilldown');
    const overviewBtn = document.getElementById('overviewBtn');
    const drillBtn = document.getElementById('drillBtn');
    const toast = document.getElementById('toast');
    const toastTitle = document.getElementById('toastTitle');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;

    function setScreen(name) {
      const isDrill = name === 'drilldown';
      overview.classList.toggle('active', !isDrill);
      drilldown.classList.toggle('active', isDrill);
      overviewBtn.classList.toggle('active', !isDrill);
      drillBtn.classList.toggle('active', isDrill);
      window.location.hash = isDrill ? 'drilldown' : 'overview';
    }

    function showToast(title, text) {
      toastTitle.textContent = title;
      toastText.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
    }

    document.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action]');
      if (actionEl) {
        const action = actionEl.getAttribute('data-action');
        if (action === 'drilldown') {
          setScreen('drilldown');
          showToast('BSS Blanket System opened', 'Subsystem cutaway, root-cause ranking, evidence logs and recommended actions are displayed.');
        }
        if (action === 'overview') {
          setScreen('overview');
          showToast('Machine Overview', 'Returned to the full Landa S11-1P Service Radar.');
        }
        return;
      }

      const componentEl = event.target.closest('[data-component]');
      if (componentEl) {
        const component = componentEl.getAttribute('data-component');
        const critical = component === 'Blanket Cylinder';
        const warning = component === 'Pressure Sensor';
        showToast(
          component + ' selected',
          critical
            ? 'Critical component. PANDA ranks it as the most likely root cause for the pressure deviation.'
            : warning
              ? 'Warning component. Check calibration and compare against the Blanket Cylinder evidence.'
              : 'Normal component. Included for context and correlation checks.'
        );
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setScreen('overview');
      if (event.key === '1') setScreen('overview');
      if (event.key === '2') setScreen('drilldown');
    });

    window.addEventListener('load', () => {
      const initial = window.location.hash.replace('#', '') === 'drilldown' ? 'drilldown' : 'overview';
      setScreen(initial);
      setTimeout(() => document.getElementById('loading').classList.add('hide'), 420);
    });
  </script>
</body>
</html>
